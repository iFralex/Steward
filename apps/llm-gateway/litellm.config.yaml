# LiteLLM gateway. Run: litellm --config litellm.config.yaml --port 4000
#
# Public namespace = a CAPABILITY LADDER, vendor-agnostic:
#   tier-1 (weak local) ... tier-6 (strongest paid).
# Callers pick a tier number; the real models live ONLY here.
#
# Workhorse: DeepSeek V4 Flash (paid, ~$0.14/$0.28 per 1M in/out, prompt caching).
# Empirically it handles every mail task RELIABLY and cheaply — role-classify
# 18/18, and the combined triage (classify+distil in one call) makes faithful,
# specific notes with zero hallucination at ~$0.00016/call. The previous free
# OpenRouter tiers were unreliable (rate-limits + mismatches) and the Claude
# subscription tiers are retired here in favour of this cheap paid API.
#
# Across tiers: on failure a tier ESCALATES UP to a stronger/more reliable tier
# (tier-1 -> ... -> tier-6), then sweeps the lower tiers, so a request tries
# every rung before giving up. Embeddings are a separate axis: `local-embed`.
#
# Swap/extend a tier by editing only its block here. DeepSeek model ids live at
# https://api.deepseek.com; LiteLLM routes `deepseek/*` there via DEEPSEEK_API_KEY.
model_list:
  # --- tier-1: weak/cheap, always-available local (offline backstop) ---
  - model_name: tier-1
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://127.0.0.1:11434

  # --- tier-2..5: DeepSeek V4 Flash — the reliable cheap workhorse ---
  # (Mail-promoter triage defaults to tier-5; role-classify uses tier-2.)
  - model_name: tier-2
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: tier-3
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: tier-4
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: tier-5
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  # --- tier-6: DeepSeek V4 Pro — top rung for the hardest cases / escalation ---
  - model_name: tier-6
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  # --- embeddings (separate axis, not a capability tier) ---
  - model_name: local-embed
    litellm_params:
      model: ollama/bge-m3
      api_base: http://127.0.0.1:11434

litellm_settings:
  num_retries: 3
  request_timeout: 120
  # On failure, ESCALATE/shuffle among the PAID DeepSeek tiers (2..6). tier-1 is
  # the local llama-1b offline backstop and is deliberately NOT a fallback: it is
  # too weak for any real task, so degrading to it would emit wrong answers
  # instead of a clean error. With every paid tier on the same DeepSeek key, an
  # exhausted-credits / outage condition makes ALL of 2..6 fail and surfaces a
  # real error to the caller (the backfill then defers + resumes), rather than
  # silently producing junk. Invoke tier-1 explicitly when you actually want it.
  fallbacks:
    - tier-2: ["tier-3", "tier-4", "tier-5", "tier-6"]
    - tier-3: ["tier-4", "tier-5", "tier-6", "tier-2"]
    - tier-4: ["tier-5", "tier-6", "tier-3", "tier-2"]
    - tier-5: ["tier-6", "tier-4", "tier-3", "tier-2"]
    - tier-6: ["tier-5", "tier-4", "tier-3", "tier-2"]
  context_window_fallbacks:
    - tier-2: ["tier-3", "tier-4", "tier-5", "tier-6"]
    - tier-3: ["tier-4", "tier-5", "tier-6", "tier-2"]
    - tier-4: ["tier-5", "tier-6", "tier-3", "tier-2"]
    - tier-5: ["tier-6", "tier-4", "tier-3", "tier-2"]
    - tier-6: ["tier-5", "tier-4", "tier-3", "tier-2"]

router_settings:
  routing_strategy: simple-shuffle   # spread load across the comparable models + key pool
  num_retries: 3
  retry_after: 5
  cooldown_time: 30                  # park a deployment that just failed
  allowed_fails: 2
